<body>

    <div class="Productos-grid">

        <div class="grid-item">
                <div class="grid-imagen">
                    <img src="img/1.jpg">
                </div>
                <figcaption>
                    <p class="Nombre_Producto">Marvel Spider-Man: Brand New Day Spider-Man sudadera</p>
                    <div class="precio-container">
                        <h3 class="precio">$1200.00</h3>
                    <button class="agregar-btn">Agregar<img src="img/Carrito.png" alt="Agregar"></button>
                </figcaption>
        </div>

        <div class="grid-item">
                <div class="grid-imagen">
                    <img src="img/2.webp">
                </div>
                <figcaption>
                    <p class="Nombre_Producto">Pendientes de Marvel Spider-Man</p>
                    <div class="precio-container">
                        <h3 class="precio">$200.00</h3>
                    <button class="agregar-btn">Agregar<img src="img/Carrito.png" alt="Agregar"></button>
                </figcaption>
        </div>

        <div class="grid-item">
                <div class="grid-imagen">
                    <img src="img/3.webp">
                </div>
                <figcaption>
                    <p class="Nombre_Producto">Mini vasos de Marvel Spider-Man</p>
                    <div class="precio-container">

                    <button class="agregar-btn">Agregar<img src="img/Carrito.png" alt="Agregar"></button>
                </figcaption>
        </div>

        <div class="grid-item">
                <div class="grid-imagen">
                    <img src="img/4.webp">
                </div>
                <figcaption>
                    <p class="Nombre_Producto">Camiseta Marvel Spider-Man </p>
                    <div class="precio-container">
                        <h3 class="precio">$500.00</h3>
                    <button class="agregar-btn">Agregar<img src="img/Carrito.png" alt="Agregar"></button>
                </figcaption>
        </div>

        <div class="grid-item">
                <div class="grid-imagen">
                    <img src="img/5.webp">
                </div>
                <figcaption>
                    <p class="Nombre_Producto">¡Funko Pop! Figura de vinilo navideño de Marvel Spider-Man</p>
                    <div class="precio-container">
                        <h3 class="precio">$300.00</h3>
                    <button class="agregar-btn">Agregar<img src="img/Carrito.png" alt="Agregar"></button>
                </figcaption>
        </div>

    </div>
</div>

<script>

const botonesAgregar = document.querySelectorAll('.agregar-btn');
let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

botonesAgregar.forEach(boton => {
    boton.addEventListener('click', (e) => {
        const elementoProducto = e.target.closest('.grid-item');
        if (!elementoProducto) return;

        const nombre = elementoProducto.querySelector('.Nombre_Producto').textContent.trim();
        const textoPrecio = elementoProducto.querySelector('.precio').textContent.trim();
        const precio = parseFloat(textoPrecio.replace('$', '').replace(',', ''));
        const imagen = elementoProducto.querySelector('.grid-imagen img').src;

        if (nombre && !isNaN(precio)) {
            agregarAlCarrito(nombre, precio, imagen);
            guardarCarrito();
        } else {
            console.error('Error: Datos del producto incompletos o mal formateados.');
        }
    });
});

function agregarAlCarrito(nombre, precio, imagen) {
    const id = Date.now();
    const productoExistente = carrito.find(item => item.nombre === nombre);

    if (productoExistente) {
        productoExistente.cantidad += 1;
    } else {
        carrito.push({ id, nombre, precio, cantidad: 1, imagen });
    }

    console.log(carrito);
}

function guardarCarrito() {
    localStorage.setItem('carrito', JSON.stringify(carrito));
}


</script>

</body>
</html>
